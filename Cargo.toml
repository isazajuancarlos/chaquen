[package]
name = "chaquen"
version = "0.2.0"
edition = "2021"
rust-version = "1.98"
license = "LicenseRef-Propietario"
authors = ["Juan Carlos Isaza"]
description = "Detector de secretos (credenciales, tokens, llaves) en Rust — guarda el lindero entre lo privado y lo expuesto."
repository = "Z:/espejos/chaquen.git"

[[bin]]
name = "chaquen"
path = "src/main.rs"

[lib]
name = "chaquen"
path = "src/lib.rs"

[dependencies]
aho-corasick = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
anyhow = "1"

[dev-dependencies]

# Las DEPENDENCIAS optimizadas también en debug (estándar de nacimiento).
[profile.dev.package."*"]
opt-level = 3

# PUERTA de buenas prácticas (el CI corre -D warnings). Solo lo que se bloquea.
[lints.clippy]
redundant_clone = "deny"
needless_collect = "deny"
